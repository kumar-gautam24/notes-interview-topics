services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DB_DSN: postgresql://lab:lab@db:5432/lab
      DB_POOL_SIZE: "${DB_POOL_SIZE:-10}"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-1.0}"
          memory: "${API_MEM:-256M}"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h localhost forces TCP, so this only passes after seeding finishes
      test: ["CMD-SHELL", "pg_isready -h localhost -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-1.0}"
          memory: "${DB_MEM:-512M}"

  # ---- Monitoring -------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
    depends_on: [prometheus]

  cadvisor:            # per-container CPU, memory, throttling
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports: ["8080:8080"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  postgres-exporter:   # Postgres connections, activity, etc.
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://lab:lab@db:5432/lab?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
